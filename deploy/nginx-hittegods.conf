# Nginx som reverse proxy og load balancer foran to Node.js-instanser.
# Kopieres til /etc/nginx/sites-available/hittegods. Certbot tilføjer selv HTTPS-delen.

upstream hittegods_app {
    # Round robin er standard: requests fordeles skiftevis mellem instanserne
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name hittegods.plexit.group;

    # Billeder fra personalet må være op til 5 MB (samme grænse som i multer)
    client_max_body_size 6M;

    location / {
        proxy_pass http://hittegods_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
