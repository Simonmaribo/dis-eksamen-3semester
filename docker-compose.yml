# Kun til lokal udvikling: MySQL som separat service.
# På Droplet'en installeres MySQL direkte, og appen forbinder på samme måde via .env.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hittegods
      MYSQL_USER: hittegods
      MYSQL_PASSWORD: hittegods
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
